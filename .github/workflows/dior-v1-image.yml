name: Dior V1 full image

on:
  push:
    branches: [linux-server-armhf]
    paths:
      - 'frontend/**'
      - 'linux/dior/**'
      - '.github/workflows/dior-v1-image.yml'
  workflow_dispatch:

# A full kernel/rootfs build is deliberately NOT duplicated for pull_request.
concurrency:
  group: dior-v1-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dior-v1-image:
    # The candidate contains a freshly generated, private first-login password.
    # Never upload it from a public fork; no secrets or SMTP codes are required.
    if: github.repository == 'zhuge1993/canvas-editor' && github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PMB_SUDO: sudo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Test build adapter and first-flash control flow (offline only)
        run: python3 -m unittest discover -s linux/dior/tests -v
      - name: Install Linux image-build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 openssl sudo kpartx \
            util-linux procps tar xz-utils zstd rsync file \
            e2fsprogs parted dosfstools qemu-user-static binfmt-support
          sudo -n true
          sudo losetup -f
          df -h
      - name: Build FlowBoard, dior kernel, firmware, boot and rootfs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flowboard-dior-v1/logs"
          python3 linux/dior/ci-build-image.py 2>&1 \
            | tee "$RUNNER_TEMP/flowboard-dior-v1/logs/build.log"
      - name: Upload complete image candidate (not real-device validated)
        uses: actions/upload-artifact@v4
        with:
          name: DiorLinux-FlowBoard-V1-${{ github.sha }}
          path: ${{ runner.temp }}/flowboard-dior-v1/release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Prepare redacted build diagnostics
        if: always()
        run: python3 linux/dior/ci-build-image.py collect-logs
      - name: Upload build diagnostics, including on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dior-V1-build-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/flowboard-dior-v1/diagnostics/
          if-no-files-found: warn
          retention-days: 7
