name: Linux server build

on:
  push:
    branches:
      - linux-server-armhf
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Validate Dior shell scripts
        run: |
          sh -n linux/dior/build-image.sh
          sh -n linux/dior/build-v1-first-flash.sh
          sh -n tools/dior-usb-repair/inject-dior-hardware.sh
          sh -n tools/dior-hw/dior-hw-probe
          sh -n tools/dior-hw/dior-hw-verify
          sh -n tools/dior-hw/dior-hw-smoke
          sh -n linux/dior/flowboard-apk/dior-firmware.initd
          sh -n linux/dior/flowboard-apk/dior-adsp.initd
          test ! -f linux/dior/flowboard-apk/dior-bluetooth.initd || sh -n linux/dior/flowboard-apk/dior-bluetooth.initd
          sh -n linux/dior/pmaports-snapshot/main/wcnss-wlan/wcnss-wlan.initd
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build Linux release
        working-directory: frontend
        run: pnpm run build:linux
      - name: Inspect release
        working-directory: frontend
        run: |
          test -s FlowBoard-linux.tar.gz
          tar -tzf FlowBoard-linux.tar.gz | sort
      - name: Validate Dior hardware integration
        run: |
          set -eu
          sh -n linux/dior/flowboard-apk/dior-firmware.initd
          sh -n linux/dior/flowboard-apk/dior-adsp.initd
          sh -n linux/dior/flowboard-apk/dior-bluetooth.initd
          sh -n linux/dior/flowboard-apk/dior-gps.initd
          sh -n tools/dior-hw/dior-hw-probe
          sh -n tools/dior-hw/dior-touch-test
          sh -n tools/dior-hw/dior-hw-verify
          sh -n tools/dior-hw/dior-hw-smoke
          sh -n tools/dior-usb-repair/inject-dior-hardware.sh
          python3 -m py_compile tools/dior-boot/trim-qcdt.py
          grep -q '^CONFIG_MSM_KGSL=y$' linux/dior/pmaports-snapshot/device/archived/linux-xiaomi-dior/config-xiaomi-dior.armv7
          grep -q '^CONFIG_IMMERSION_HAPTIC=y$' linux/dior/pmaports-snapshot/device/archived/linux-xiaomi-dior/config-xiaomi-dior.armv7
          grep -q '^CONFIG_RFKILL=y$' linux/dior/pmaports-snapshot/device/archived/linux-xiaomi-dior/config-xiaomi-dior.armv7
          grep -q '^CONFIG_BT_HCISMD=y$' linux/dior/pmaports-snapshot/device/archived/linux-xiaomi-dior/config-xiaomi-dior.armv7
          grep -q '^CONFIG_MSM_SMD_NMEA=y$' linux/dior/pmaports-snapshot/device/archived/linux-xiaomi-dior/config-xiaomi-dior.armv7
          grep -q '^CONFIG_QPNP_CHARGER=y$' linux/dior/pmaports-snapshot/device/archived/linux-xiaomi-dior/config-xiaomi-dior.armv7
          grep -q '^CONFIG_QPNP_BMS=y$' linux/dior/pmaports-snapshot/device/archived/linux-xiaomi-dior/config-xiaomi-dior.armv7
          grep -q '^CONFIG_RADIO_IRIS=y$' linux/dior/pmaports-snapshot/device/archived/linux-xiaomi-dior/config-xiaomi-dior.armv7
          grep -q 'a330_pm4.fw' linux/dior/pmaports-snapshot/device/archived/firmware-xiaomi-dior/APKBUILD
          grep -q 'venus.mdt' linux/dior/pmaports-snapshot/device/archived/firmware-xiaomi-dior/APKBUILD
          grep -q 'MTP_Speaker_cal.acdb' linux/dior/pmaports-snapshot/device/archived/firmware-xiaomi-dior/APKBUILD
      - name: Upload Linux release
        uses: actions/upload-artifact@v4
        with:
          name: FlowBoard-linux
          path: frontend/FlowBoard-linux.tar.gz
          if-no-files-found: error
