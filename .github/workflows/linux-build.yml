name: Linux server build

on:
  push:
    branches:
      - linux-server-armhf
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build Linux release
        working-directory: frontend
        run: pnpm run build:linux
      - name: Inspect release
        working-directory: frontend
        run: |
          test -s FlowBoard-linux.tar.gz
          tar -tzf FlowBoard-linux.tar.gz | sort
      - name: Validate Dior hardware integration scripts
        run: |
          set -eu
          sh -n linux/dior/flowboard-apk/dior-firmware.initd
          sh -n linux/dior/flowboard-apk/dior-adsp.initd
          sh -n tools/dior-hw/dior-hw-probe
          sh -n tools/dior-hw/dior-touch-test
          sh -n tools/dior-hw/dior-hw-verify
          sh -n tools/dior-usb-repair/inject-dior-hardware.sh
          grep -q '^CONFIG_MSM_KGSL=y$' linux/dior/pmaports-snapshot/device/archived/linux-xiaomi-dior/config-xiaomi-dior.armv7
          grep -q '^CONFIG_IMMERSION_HAPTIC=y$' linux/dior/pmaports-snapshot/device/archived/linux-xiaomi-dior/config-xiaomi-dior.armv7
          grep -q '^CONFIG_RFKILL=y$' linux/dior/pmaports-snapshot/device/archived/linux-xiaomi-dior/config-xiaomi-dior.armv7
          grep -q 'a330_pm4.fw' linux/dior/pmaports-snapshot/device/archived/firmware-xiaomi-dior/APKBUILD
          grep -q 'venus.mdt' linux/dior/pmaports-snapshot/device/archived/firmware-xiaomi-dior/APKBUILD
          grep -q 'MTP_Speaker_cal.acdb' linux/dior/pmaports-snapshot/device/archived/firmware-xiaomi-dior/APKBUILD
      - name: Calculate locked Dior firmware hashes
        shell: bash
        run: |
          set -euo pipefail
          commit=421527f4e54d645adaf762b4f14cc5fd4d19a5b5
          fw_base="https://raw.githubusercontent.com/msfkonsole/proprietary_vendor_xiaomi/$commit/dior/proprietary/etc/firmware"
          acdb_base="https://raw.githubusercontent.com/msfkonsole/proprietary_vendor_xiaomi/$commit/dior/proprietary/etc/acdbdata/MTP"
          for name in             venus.b00 venus.b01 venus.b02 venus.b03 venus.b04 venus.mbn venus.mdt             cpp_firmware_v1_1_1.fw cpp_firmware_v1_1_6.fw cpp_firmware_v1_2_0.fw             a300_pfp.fw a300_pm4.fw a330_pfp.fw a330_pm4.fw
          do
            hash="$(curl -fsSL --retry 3 "$fw_base/$name" | sha512sum | awk '{print $1}')"
            echo "DIOR_FW_HASH $name $hash"
          done
          for name in             MTP_Bluetooth_cal.acdb MTP_General_cal.acdb MTP_Global_cal.acdb             MTP_Handset_cal.acdb MTP_Hdmi_cal.acdb MTP_Headset_cal.acdb MTP_Speaker_cal.acdb
          do
            hash="$(curl -fsSL --retry 3 "$acdb_base/$name" | sha512sum | awk '{print $1}')"
            echo "DIOR_FW_HASH $name $hash"
          done
      - name: Upload Linux release
        uses: actions/upload-artifact@v4
        with:
          name: FlowBoard-linux
          path: frontend/FlowBoard-linux.tar.gz
          if-no-files-found: error
